source = ~/.config/dotfiles-theme/hyprlock.conf
source = ~/.config/dotfiles-theme/wallpaper.conf

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 5
}

input-field {
    monitor =
    size = 420, 72
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Password</span>
    fail_text = <span foreground="##f7768e">$FAIL</span>
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d. %B"
    color = $muted
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}
