# Prefix: Ctrl+A (mere ergonomisk end Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config genindlæst"

# Split panes — intuitive symboler, åbner i samme mappe
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Ny window i samme mappe
bind c new-window -c "#{pane_current_path}"

# Naviger panes med vim-taster
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (hold Prefix, tryk gentagne gange)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mus
set -g mouse on

# Start nummerering fra 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 256 farver + true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Scrollback buffer
set -g history-limit 50000

# Hurtigere ESC i nvim
set -g escape-time 10

# Vi-mode i copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Status bar — Nord farver
set -g status-position bottom
set -g status-style "bg=#3B4252,fg=#D8DEE9"
set -g status-left-length 30
set -g status-right-length 100

set -g status-left "#[fg=#88C0D0,bold] #S #[fg=#4C566A]│ "
set -g status-right "#[fg=#EBCB8B]%H:%M #[fg=#4C566A]│ #[fg=#81A1C1]%d/%m/%Y "

setw -g window-status-current-style "fg=#88C0D0,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#4C566A"
setw -g window-status-format " #I:#W "

# Pane border farver
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"

# Message style
set -g message-style "bg=#EBCB8B,fg=#2E3440,bold"
